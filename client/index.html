<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>SGFX Terminal — MT5 Web Trading</title>

    <!-- SEO -->
    <meta name="description" content="SGFX Terminal: MT5 web trading with live forex and CFD prices, charts and market data." />
    <meta name="keywords" content="SGFX, MT5, MetaTrader 5, web trading, forex, CFD, trading terminal" />
    <meta name="author" content="SGFX" />

    <!-- Open Graph -->
    <meta property="og:title" content="SGFX Terminal" />
    <meta property="og:description" content="MT5 web trading with live prices, charts and market data." />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SGFX Terminal" />
    <meta name="twitter:description" content="MT5 web trading with live prices, charts and market data." />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Theme before first paint (src/lib/theme.ts keeps it in step afterwards), so light mode never flashes dark -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('trading-terminal-storage') || '{}').state.settings.theme;
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
